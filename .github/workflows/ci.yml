# Every pull request and every push to main: typecheck, tests, the window's build and
# the terminal client's build, on macOS, Linux and Windows, so a change can't break one
# of them unnoticed. The tour runs in a real pty on Linux only: it is the fork's
# end-to-end evidence (docs/spec-tuicano.md §5), and one operating system is enough for
# a terminal client.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests and the build don't run Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:tui
